name: Build resume

on:
  push:
    paths: ["resume.tex", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex

      - name: Rename PDF
        run: sudo mv resume.pdf Palash_Pawar_Resume.pdf

      - name: Check it is one page
        run: |
          pages=$(pdfinfo Palash_Pawar_Resume.pdf 2>/dev/null | awk '/^Pages:/{print $2}' || true)
          if [ -z "$pages" ]; then sudo apt-get install -y -qq poppler-utils >/dev/null && pages=$(pdfinfo Palash_Pawar_Resume.pdf | awk '/^Pages:/{print $2}'); fi
          echo "Pages: $pages"
          [ "$pages" = "1" ] || echo "::warning::Resume is $pages pages"

      # Every branch gets a downloadable PDF on its Actions run
      - uses: actions/upload-artifact@v4
        with:
          name: Palash_Pawar_Resume-${{ github.ref_name }}
          path: Palash_Pawar_Resume.pdf

      # main also refreshes the "latest" release, giving a stable download link
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Palash_Pawar_Resume.pdf \
            --title "Resume ($(date -u +%Y-%m-%d))" \
            --notes "Built from ${GITHUB_SHA::7}" --latest
